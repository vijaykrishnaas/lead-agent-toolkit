name: CI

on:
  push:
    branches: [claude/dev, main]
  pull_request:
    branches: [claude/dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            reviewer/package-lock.json
            sample-app/package-lock.json

      - name: Install reviewer dependencies
        run: npm ci
        working-directory: reviewer

      - name: Install sample-app dependencies
        run: npm ci
        working-directory: sample-app

      - name: Run test suites
        run: npm test

  invariant-lint:
    name: Invariant lint (CLAUDE.md hard invariants 2 & 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Determine this run's diff range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            RANGE=$(node scripts/resolvePushRange.js)
          fi
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Lint hard invariants 2 & 3
        run: node scripts/invariantLint.js "${{ steps.range.outputs.range }}"

  dogfood:
    name: Reviewer dogfood (non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: reviewer/package-lock.json

      - name: Install reviewer dependencies
        run: npm ci
        working-directory: reviewer

      - name: Determine this push's diff range
        id: range
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          RANGE=$(node scripts/resolvePushRange.js)
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run reviewer on this push's diff
        run: node reviewer/src/cli.js "${{ steps.range.outputs.range }}" --out dogfood-report.md

      - name: Upload dogfood report
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-review-report
          path: dogfood-report.md
